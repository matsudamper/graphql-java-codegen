plugins {
    id "java"
    id "idea"
    id "jacoco"
    id "java-library"
    id "com.vanniktech.maven.publish" version "0.37.0"
}

group = "net.matsudamper"
// Pass -PreleaseVersion=x.y.z (or ORG_GRADLE_PROJECT_releaseVersion) to set the version.
// Local builds default to "local".
version = providers.gradleProperty("releaseVersion").getOrElse("local")

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.freemarker:freemarker:2.3.35"
    compileOnly "com.graphql-java:graphql-java:26.1"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:2.22.4"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testImplementation "org.junit.jupiter:junit-jupiter-params:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.hamcrest:java-hamcrest:2.0.0.0"
}

test.useJUnitPlatform()

task codeCoverageReport(type: JacocoReport) {
    executionData fileTree(project.rootDir.absolutePath).include("build/jacoco/*.exec")

    sourceSets sourceSets.main

    reports {
        html.required = false
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/report.xml")
    }
}

configurations {
    testImplementation.extendsFrom compileOnly
}

test {
    testLogging {
        events "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }
}

codeCoverageReport.dependsOn test

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"
javadoc.options.encoding = "UTF-8"

mavenPublishing {
    coordinates("net.matsudamper", "graphql-java-codegen", version.toString())
    pom {
        name = "GraphQL Java CodeGen"
        description = "Java Code Generator based on GraphQL schema"
        url = "https://github.com/matsudamper/graphql-java-codegen"
        organization {
            name = "net.matsudamper"
            url = "https://github.com/matsudamper"
        }
        issueManagement {
            system = "GitHub"
            url = "https://github.com/matsudamper/graphql-java-codegen/issues"
        }
        licenses {
            license {
                name = "MIT License"
                url = "https://github.com/matsudamper/graphql-java-codegen/blob/main/LICENSE.md"
                distribution = "repo"
            }
        }
        scm {
            url = "https://github.com/matsudamper/graphql-java-codegen"
            connection = "scm:git:git://github.com/matsudamper/graphql-java-codegen.git"
            developerConnection = "scm:git:ssh://git@github.com:matsudamper/graphql-java-codegen.git"
        }
        developers {
            developer {
                id = "matsudamper"
                name = "matsudamper"
            }
        }
    }
}

if (project.hasProperty("mavenCentralUsername")) {
    mavenPublishing {
        publishToMavenCentral(true)
        signAllPublications()
    }
    // Reject "local" only when a Maven Central publish is actually requested.
    gradle.taskGraph.whenReady { graph ->
        if (version == "local" && graph.allTasks.any { it.name.contains("MavenCentral") }) {
            throw new GradleException("releaseVersion must be set to publish to Maven Central")
        }
    }
}

publishing {
    repositories {
        def githubPackagesToken = System.getenv("GITHUB_TOKEN")
        if (githubPackagesToken) {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/matsudamper/graphql-java-codegen")
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: "matsudamper"
                    password = githubPackagesToken
                }
            }
        }
    }
}

// The build runs on a modern JDK, but the published artifact must stay
// Java 8 compatible.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Some dependencies are published as Java 11+ artifacts. Resolve the build
// classpaths against the JDK the build runs on; the consumable variants keep
// declaring Java 8 (from targetCompatibility above), so consumers of this
// artifact are unaffected.
configurations.configureEach {
    if (canBeResolved) {
        attributes {
            attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
    }
}
