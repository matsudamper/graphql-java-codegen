name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        default: 'X.X.X'
        required: true
      release_branch:
        description: 'Release branch'
        default: 'main'
        required: true
      publish_library:
        description: 'Publish library'
        default: 'Y'
        required: true
      publish_gradle_plugin:
        description: 'Publish Gradle Plugin'
        default: 'Y'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_releaseVersion: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.release_branch }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle
          key: gradle

      - name: Build library
        run: ./gradlew build publishToMavenLocal --warning-mode all

      - name: Build gradle plugin
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin build publishToMavenLocal --warning-mode all

      - name: Build gradle example-server
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-server test --warning-mode all

      - name: Build gradle example-client
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-client test --warning-mode all

      - name: Build gradle example-client-kotlin
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-client-kotlin build --warning-mode all

      - name: Release library
        if: github.event.inputs.publish_library == 'Y'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --warning-mode all

      - name: Release Gradle plugin
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin publishToMavenCentral --warning-mode all

      - name: Create GitHub Release
        if: github.event.inputs.publish_library == 'Y' || github.event.inputs.publish_gradle_plugin == 'Y'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.event.inputs.release_version }}" --target "$(git rev-parse HEAD)" --title "v${{ github.event.inputs.release_version }}" --generate-notes
