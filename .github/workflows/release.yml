name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 5.11.0)'
        required: true
      release_branch:
        description: 'Release branch'
        default: 'main'
        required: true
      publish_gradle_plugin:
        description: 'Publish Gradle Plugin (Y/N)'
        default: 'Y'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.release_branch }}

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle
          key: gradle

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update versions of all Gradle sub-projects
        run: scripts/update-release-version-in-build-files.sh ${{ github.event.inputs.release_version }}

      - name: Update versions in all README files
        run: scripts/update-release-version-in-readme.sh ${{ github.event.inputs.release_version }}

      #
      # VERSIONS UPDATED
      # NOW WE ARE READY FOR THE FINAL BUILD
      #

      - name: Build library
        run: ./gradlew build publishToMavenLocal --warning-mode all

      - name: Build gradle plugin
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin build publishToMavenLocal --warning-mode all

      - name: Build gradle example-server
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-server test --warning-mode all

      - name: Build gradle example-client
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-client test --warning-mode all

      - name: Build gradle example-client-kotlin
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        run: ./gradlew -p plugins/gradle/example-client-kotlin build --warning-mode all

      #
      # BUILD OF RELEASE VERSION COMPLETED
      # SO WE CAN COMMIT IT
      #

      - name: Commit and tag release version
        run: |
          git commit -am "Bump version to ${{ github.event.inputs.release_version }}"
          git tag -a "v${{ github.event.inputs.release_version }}" \
            -m "Release ${{ github.event.inputs.release_version }}"

      #
      # VERSIONS ARE IN THE RELEASE STATE AND READY TO PUBLISH
      # THIS FORK PUBLISHES TO GITHUB PACKAGES OF THIS REPOSITORY
      #

      - name: Publish library to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publish --warning-mode all

      - name: Publish Gradle plugin to GitHub Packages
        if: github.event.inputs.publish_gradle_plugin == 'Y'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin publish --warning-mode all

      #
      # PUBLISH OF RELEASE VERSION COMPLETED
      # NOW PUSHING THE RELEASE COMMIT AND TAG BACK TO THE REPOSITORY
      #

      - name: Push release version
        run: |
          git push origin HEAD:${{ github.event.inputs.release_branch }}
          git push origin "v${{ github.event.inputs.release_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.release_version }}" \
            --title "v${{ github.event.inputs.release_version }}" \
            --generate-notes
