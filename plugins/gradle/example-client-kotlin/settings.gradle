pluginManagement {
    plugins {
        id "net.matsudamper.graphql.codegen" version providers.gradleProperty("releaseVersion").getOrElse("local")
    }
    repositories {
        mavenLocal()
        maven {
            url "https://maven.matsudamper.net/releases"
            content {
                includeGroupAndSubgroups "net.matsudamper"
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'example-client-kotlin'
