plugins {
    id "java-gradle-plugin"
    id "com.vanniktech.maven.publish" version "0.37.0"
}

repositories {
    maven {
        url 'https://repo.gradle.org/gradle/libs-releases-local'
    }
    mavenCentral()
    mavenLocal()
}

apply plugin: "java"
apply plugin: "idea"

group = "net.matsudamper"
// Pass -PreleaseVersion=x.y.z (or ORG_GRADLE_PROJECT_releaseVersion) to set the version.
// Local builds default to "local".
version = providers.gradleProperty("releaseVersion").getOrElse("local")
description = "Provides a task for generating Java code based on GraphQL schema"

dependencies {
    implementation gradleApi()

    implementation "net.matsudamper:graphql-java-codegen:${version}"

    implementation "org.freemarker:freemarker:2.3.35"
    implementation "com.graphql-java:graphql-java:26.1"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.2"
    implementation "com.typesafe:config:1.4.9"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/matsudamper/graphql-java-codegen/tree/main/plugins/gradle/graphql-java-codegen-gradle-plugin'
    vcsUrl = 'https://github.com/matsudamper/graphql-java-codegen'
    plugins {
        graphqlCodegen {
            id = 'net.matsudamper.graphql.codegen'
            displayName = 'GraphQL Java Codegen'
            description = 'Gradle plugin for GraphQL Java code generation'
            implementationClass = 'io.github.kobylynskyi.graphql.codegen.gradle.GraphQLCodegenGradlePlugin'
            tags.set(['graphql', 'graphql-java', 'graphql-java-codegen', 'graphql-codegen'])
        }
    }
}

mavenPublishing {
    coordinates("net.matsudamper", "graphql-java-codegen-gradle-plugin", version.toString())
    pom {
        name = "GraphQL Java Codegen Gradle Plugin"
        description = "Gradle plugin for GraphQL Java code generation"
        url = "https://github.com/matsudamper/graphql-java-codegen"
        organization {
            name = "net.matsudamper"
            url = "https://github.com/matsudamper"
        }
        issueManagement {
            system = "GitHub"
            url = "https://github.com/matsudamper/graphql-java-codegen/issues"
        }
        licenses {
            license {
                name = "MIT License"
                url = "https://github.com/matsudamper/graphql-java-codegen/blob/main/LICENSE.md"
                distribution = "repo"
            }
        }
        scm {
            url = "https://github.com/matsudamper/graphql-java-codegen"
            connection = "scm:git:git://github.com/matsudamper/graphql-java-codegen.git"
            developerConnection = "scm:git:ssh://git@github.com:matsudamper/graphql-java-codegen.git"
        }
        developers {
            developer {
                id = "matsudamper"
                name = "matsudamper"
            }
        }
    }
}

if (project.hasProperty("mavenCentralUsername")) {
    mavenPublishing {
        publishToMavenCentral(true)
        signAllPublications()
    }
    // Reject "local" only when a Maven Central publish is actually requested.
    gradle.taskGraph.whenReady { graph ->
        if (version == "local" && graph.allTasks.any { it.name.contains("MavenCentral") }) {
            throw new GradleException("releaseVersion must be set to publish to Maven Central")
        }
    }
}

publishing {
    repositories {
        def githubPackagesToken = System.getenv("GITHUB_TOKEN")
        if (githubPackagesToken) {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/matsudamper/graphql-java-codegen")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = githubPackagesToken
                }
            }
        }
    }
}

// The build runs on a modern JDK, but the published artifact must stay
// Java 8 compatible.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Some dependencies are published as Java 11+ artifacts. Resolve the build
// classpaths against the JDK the build runs on; the consumable variants keep
// declaring Java 8 (from targetCompatibility above), so consumers of this
// artifact are unaffected.
configurations.configureEach {
    if (canBeResolved) {
        attributes {
            attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
    }
}

test {
    useJUnitPlatform()
}
